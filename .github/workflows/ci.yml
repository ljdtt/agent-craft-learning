name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install portfolio dependencies
        run: python -m pip install -r m13_streamlit/requirements.txt
      - name: Compile tracked Python files
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode().split('\0')
          for name in filter(None, paths):
              compile(pathlib.Path(name).read_bytes(), name, 'exec')
          PY
      - name: Test cloud portfolio
        env:
          OPENAI_API_KEY: ''
        run: python -m unittest discover -s tests -v
